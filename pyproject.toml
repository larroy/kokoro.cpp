[project]
name = "kokoro-cpp-tools"
version = "0.1.0"
description = "Setup and voice tools for kokoro.cpp"
requires-python = ">=3.10"
dependencies = ["click>=8.1"]

[dependency-groups]
voice = ["torch>=2.4", "numpy>=1.26"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
